[build]
functions = "netlify/functions"
publish = "public"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/scores"
to = "/.netlify/functions/scores"
status = 200

[[headers]]
for = "/api/gameboy-highscore"
[headers.values]
Cache-Control = "no-store, max-age=0"
Netlify-CDN-Cache-Control = "no-store"
